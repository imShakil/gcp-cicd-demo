steps:
  # Step 1: Build Database Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-database'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-db:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-db:latest'
      - './database'

  # Step 2: Build Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-api:latest'
      - './backend'

  # Step 3: Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-ui:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/demo-ui:latest'
      - './frontend'

  # Step 4: Push Database image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-database'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/demo-db:$SHORT_SHA'

  # Step 5: Push Backend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/demo-api:$SHORT_SHA'

  # Step 6: Push Frontend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/demo-ui:$SHORT_SHA'

  # Step 7: Deploy to VM using gcloud compute ssh
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-vm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Set variables
        PROJECT_ID=$PROJECT_ID
        IMAGE_TAG=$SHORT_SHA
        
        
        # Copy deployment script to VM
        gcloud compute scp scripts/deploy.sh ${VM_NAME}:/tmp/deploy.sh \
          --zone=${VM_ZONE} \
          --project=${PROJECT_ID}
        
        # Copy service account key if it exists (for private image authentication)
        if [ -f /workspace/vm-key.json ]; then
          gcloud compute scp /workspace/vm-key.json ${VM_NAME}:/tmp/vm-key.json \
            --zone=$_VM_ZONE \
            --project=${PROJECT_ID}
        fi
        
        # Execute deployment script on VM
        gcloud compute ssh $_VM_NAME \
          --zone=$_VM_ZONE \
          --project=${PROJECT_ID} \
          --command="bash /tmp/deploy.sh ${PROJECT_ID} ${IMAGE_TAG}"

images:
  - 'gcr.io/$PROJECT_ID/demo-db:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/demo-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/demo-ui:$SHORT_SHA'

substitutions:
  _VM_NAME: 'demo-vm'
  _VM_ZONE: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '1800s'
